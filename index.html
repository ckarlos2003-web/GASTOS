<script>
  /* Mantiene la fecha actual alineada al calendario real antes de iniciar el mÃ³dulo. */
  (function () {
    var KEY = 'control-gastos-datos-v1';
    try {
      var cuentas = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!Array.isArray(cuentas) || !cuentas.length) {
        cuentas = [
          { id: 'movilidad', nombre: 'MOVILIDAD', color: 'green', tipo: 'laboral', inicio: hoyISO, actual: hoyISO, termino: hoyISO, presupuesto: 77, gastoDia: '', saldo: 50.94 },
          { id: 'desayuno', nombre: 'DESAY MENU L-V', color: 'yellow', tipo: 'laboral', inicio: hoyISO, actual: hoyISO, termino: hoyISO, presupuesto: 319, gastoDia: '', saldo: 209.91 },
          { id: 'sabado', nombre: 'MENU SABA', color: 'orange', tipo: 'sabado', inicio: hoyISO, actual: hoyISO, termino: hoyISO, presupuesto: 48, gastoDia: '', saldo: 36 }
        ];
      }
      var hoy = new Date();
      var hoyISO = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()).toISOString().slice(0, 10);
      var actualizado = cuentas.map(function (cuenta) {
        var fecha = hoyISO;
        if (cuenta.inicio && fecha < cuenta.inicio) fecha = cuenta.inicio;
        if (cuenta.termino && fecha > cuenta.termino) fecha = cuenta.termino;
        return Object.assign({}, cuenta, { actual: fecha });
      });
      localStorage.setItem(KEY, JSON.stringify(actualizado));
    } catch (error) {
      console.warn('No se pudo actualizar la fecha del control.', error);
    }
  }());
</script>
