<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos Operativo Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;

        // Configuración Inicial
        window.onload = async () => {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    currentUser = user;
                    setupDatabaseSync();
                }
            });
        };

        function setupDatabaseSync() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'gastos', 'state');
            
            // Escuchar cambios en tiempo real
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.state = docSnap.data();
                    renderFullApp();
                } else {
                    // Inicializar si no existe
                    window.state = { ...defaultState };
                    saveState();
                    renderFullApp();
                }
            }, (err) => console.error("Error sync:", err));
        }

        window.saveState = async () => {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'gastos', 'state');
            await setDoc(docRef, window.state);
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, #0b0f19, #020617); color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-red-border { border: 2px solid rgba(239, 68, 68, 0.85) !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.25); }
        .text-glow-red { color: #f87171 !important; text-shadow: 0 0 12px rgba(239, 68, 68, 0.6); }
        .text-glow-green { color: #34d399 !important; text-shadow: 0 0 12px rgba(16, 185, 129, 0.6); }
    </style>
</head>
<body class="p-3 sm:p-6 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6" id="app-root">
        <!-- Contenido renderizado dinámicamente -->
        <div class="flex items-center justify-center h-64 text-slate-500">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl mr-2"></i> Cargando sincronización en la nube...
        </div>
    </div>

    <script>
        // ... (Tu lógica de renderizado, renderDashboard, updateValue, etc.) ...
        // Nota: Esta es una estructura simplificada. Todo tu código JS anterior se integra aquí.
        const defaultState = { /* ... tus datos predeterminados ... */ };
        window.state = { ...defaultState };

        function renderFullApp() {
            // Re-renderiza todo el Dashboard basado en window.state
            // ... implementación completa ...
        }
    </script>
</body>
</html>
