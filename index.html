<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de Gastos</title><style>
:root{--bg:#050a18;--panel:#10192b;--line:#273853;--txt:#f6f8ff;--muted:#8fa0ba;--green:#19d8a9;--red:#ff6585;--blue:#32b7ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 25% 0,#14213c 0,var(--bg) 42%);font-family:Arial,sans-serif;color:var(--txt)}button,input{font:inherit}.app{max-width:1280px;margin:auto;padding:32px 22px 45px}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:25px}.brand{display:flex;align-items:center;gap:12px}.modules,.back{background:#111d32;color:#fff;border:1px solid #355072;border-radius:13px;padding:15px;font-weight:bold;cursor:pointer}.icon{background:var(--green);color:#062438;border-radius:12px;padding:13px;font-size:20px}.brand h1{margin:0;font-size:30px}.brand p{color:#7bb4e7;margin:5px 0}.date{background:#0c1425;border:1px solid var(--line);padding:10px 14px;border-radius:12px;color:var(--muted)}.date b{color:var(--green)}.menu{position:absolute;z-index:5;margin-top:9px;width:245px;background:#101a2d;border:1px solid #355072;border-radius:12px;padding:10px;box-shadow:0 15px 35px #0008}.menu button{width:100%;text-align:left;color:#c8d3e4;background:transparent;border:0;padding:11px;cursor:pointer}.menu button:hover{background:#192841}.menu strong{display:block;padding:9px;color:var(--green)}.panel{margin-top:24px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(110deg,#111a2d,#0d1527);overflow:hidden}.advisor{padding:25px}.eye{color:var(--green);font-weight:bold;font-size:12px;letter-spacing:.7px}.advisor h2{margin:15px 0 6px;font-size:18px}.advisor p{margin:0;color:#c9d3e3}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px;padding-top:21px;border-top:1px solid #24334c}.stat{text-align:center}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:6px;font-size:19px}.green{color:var(--green)}.blue{color:var(--blue)}.red{color:var(--red)}.head{padding:22px;display:flex;justify-content:space-between;align-items:center}.head h2{font-size:18px;margin:0}.head p{color:var(--muted);font-size:12px}.legend{font-size:10px;border:1px solid var(--line);padding:9px;border-radius:8px;color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{border-top:1px solid #21314a;border-right:1px solid #21314a;height:58px;text-align:center;font-size:13px}th{background:#091224;color:#bac7db}th:first-child,td:first-child{text-align:left;padding-left:16px;min-width:230px;font-weight:bold}th:last-child,td:last-child{border-right:0}.pill{border:0;border-radius:8px;padding:8px 10px;font-weight:bold;background:#19bc97}.pill.yellow{background:#ffc12b}.pill.orange{background:#ff7a24}.money,.datein{background:#050c1d;border:1px solid #2c405e;color:#fff;border-radius:8px;padding:9px;width:150px;text-align:right}.datein{text-align:center}.money.redline{border-color:#ed3162}.rowred{color:#ff627c}.result{background:#29221f}.balance{background:#171325}.pos{color:var(--green);font-weight:bold}.neg{color:var(--red);font-weight:bold}.muted{color:#73849d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}.card{padding:20px}.card h2{margin:0 0 15px;font-size:16px}.field{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#101a2d;border:1px solid var(--line);border-radius:12px;padding:11px;margin:9px 0;font-size:12px;font-weight:bold}.field small{display:block;color:var(--green);margin-top:4px}.field .money{width:155px}.debt{border:2px solid #f43c62;color:#ff7391}.visa{padding:17px;border-radius:12px;background:linear-gradient(135deg,#06463d,#0c1528);margin-top:13px}.visa p{color:#9fb1c7;font-size:11px}.visa .twocol{display:grid;grid-template-columns:1fr 1fr;font-size:10px;color:#9db0c7}.visa strong{display:block;color:var(--red);font-size:18px;margin-top:5px}.visa .right{text-align:right}.visa .right strong{color:var(--green)}.moveform{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin:13px 0}.moveform input{background:#111c31;border:1px solid var(--line);color:white;border-radius:8px;padding:10px;min-width:0}.moveform button{border:1px solid #15ad8b;background:#063b35;color:var(--green);border-radius:8px;font-weight:bold}.moveform .expense{border-color:#d43b5b;background:#38121f;color:#ff829a}.movement{display:flex;gap:10px;align-items:center;padding:12px;background:#101a2d;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:13px}.movement span{flex:1;font-weight:bold}.movement button{border:0;background:transparent;color:#91a4bd;cursor:pointer}.charts{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}.chart{padding:20px;min-height:290px}.charthead{display:flex;justify-content:space-between}.charthead h2{margin:0;font-size:17px}.charthead p{color:var(--muted);font-size:12px}.tag{font-size:10px;color:var(--green);border:1px solid #16705f;border-radius:7px;padding:5px;height:min-content}.bars{height:190px;display:flex;gap:6px;align-items:end;border-bottom:1px solid var(--line);padding-top:14px}.barcol{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;min-width:0}.track{height:145px;width:100%;background:#19263b;border-radius:5px 5px 0 0;display:flex;align-items:end}.track i{width:100%;border-radius:5px 5px 0 0}.barcol span{font-size:9px;color:#95a6bf}.linebox{height:190px;border-bottom:1px solid var(--line);padding-top:15px}.linebox svg{height:154px;width:100%;overflow:visible}.gridline{stroke:#2d405b;stroke-width:.6;stroke-dasharray:2 2}.l1,.l2{fill:none;stroke-width:2.6;vector-effect:non-scaling-stroke}.l1{stroke:var(--blue)}.l2{stroke:var(--green)}.labels{display:flex;justify-content:space-between;color:#95a6bf;font-size:9px}.legendline{font-size:11px;color:#b6c4d9;padding-top:11px}.legendline i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 5px 0 14px;background:var(--blue)}.legendline i:first-child{margin-left:0}.legendline .a{background:var(--green)}.sectiontitle{margin:24px 3px 10px;display:flex;justify-content:space-between;align-items:end}.sectiontitle h2{margin:0;font-size:19px}.sectiontitle p{color:var(--muted);font-size:12px;margin:5px 0}.sectiontitle span{color:var(--green);font-size:10px;font-weight:bold}@media(max-width:760px){.app{padding:18px 12px}.top{flex-direction:column;gap:13px}.brand h1{font-size:21px}.date{align-self:flex-start}.stats,.charts,.grid{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.charts,.grid{grid-template-columns:1fr}.moveform{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:flex-start}.field{align-items:flex-start;flex-direction:column}.field .money{width:100%}}
</style></head><body><main class="app" id="app"></main><script>
const K='cg_unico_v1',M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];let state=JSON.parse(localStorage.getItem(K)||'null')||{view:'gastos',menu:false,cuentas:[{n:'MOVILIDAD',t:'laboral',c:'',ini:'2026-07-22',act:'2026-08-15',fin:'2026-08-22',p:77,s:50.94},{n:'DESAY MENU L-V',t:'laboral',c:'yellow',ini:'2026-07-22',act:'2026-08-15',fin:'2026-08-22',p:319,s:209.91},{n:'MENU SABA',t:'sabado',c:'orange',ini:'2026-07-22',act:'2026-08-15',fin:'2026-08-22',p:48,s:36}],linea:12480,abono:0,movs:[{id:1,n:'El fogon ch',m:81,t:'gasto'},{id:2,n:'Tottus',m:27.75,t:'gasto'},{id:3,n:'Compras del Mes',m:734.7,t:'gasto'},{id:4,n:'Abono / Pago Registrado',m:200,t:'abono'}],hist:[]};function save(){localStorage.setItem(K,JSON.stringify(state))}function sol(x){return (x<0?'-':'')+'S/ '+Math.abs(x||0).toFixed(2)}function d(v){return new Date(v+'T00:00:00')}function count(a,b,t,rest=false){let x=d(a),z=d(b);z.setDate(z.getDate()-1);if(rest)x.setDate(x.getDate()+1);let n=0;while(x<=z){let w=x.getDay();if(t==='laboral'?w>0&&w<6:w===6)n++;x.setDate(x.getDate()+1)}return n}function calc(c){let pend=count(c.act,c.fin,c.t,true),period=count(c.ini,c.fin,c.t),used=period-pend,g=c.g===''||c.g==null?null:+c.g,res=g==null?null:+c.p-used*g;return{pend,used,g,res,f:res==null?null:res-(+c.s)}}function total(a){return a.reduce((x,y)=>x+y,0)}function money(v,fn,red=false){return '<input class="money '+(red?'redline':'')+'" type="number" step=".01" value="'+(v??'')+'" oninput="'+fn+'">'}function header(title,sub){return '<header class="top"><div class="brand"><button class="modules" onclick="state.menu=!state.menu;render()">☰ MÓDULOS</button><div class="icon">▣</div><div><h1>'+title+'</h1><p>'+sub+'</p></div></div><div class="date">▣ Fecha Control: <b>15/08/2026</b></div></header>'+(state.menu?'<nav class="menu"><strong>Mis módulos</strong><button onclick="go(\'gastos\')">▣ Control de Gastos</button><button onclick="go(\'dashboard\')">▤ Dashboard mensual</button><button onclick="go(\'interbank\')">▣ Tarjetas / Interbank</button></nav>':'')}function go(v){state.view=v;state.menu=false;save();render()}function inputC(i,k,v){state.cuentas[i][k]=v===''?'':(+v);save();render()}function dateC(i,k,v){state.cuentas[i][k]=v;save();render()}function gastos(){let cs=state.cuentas.map(calc),p=total(state.cuentas.map(x=>+x.p)),s=total(state.cuentas.map(x=>+x.s)),f=total(cs.map(x=>x.f||0));let rows=[['⌛ CUANTOS DÍAS',cs.map(x=>'Día '+x.used),'-'],['⌛ DÍAS PENDIENTES',cs.map(x=>x.pend+' días'),'-']];let h=header('Control de Gastos','Control operativo de flujos y balances diarios')+'<section class="panel advisor"><div class="eye">● RECOMENDACIÓN DE TU ASESOR PERSONAL</div><h2>● Estado Financiero '+(f<=0?'Saludable':'por revisar')+'</h2><p>Los cálculos se actualizan al instante y se guardan automáticamente.</p><div class="stats"><div class="stat"><span>Presupuesto Inicial</span><b class="green">'+sol(p)+'</b></div><div class="stat"><span>Saldo Tarjeta Total</span><b class="blue">'+sol(s)+'</b></div><div class="stat"><span>Faltante Neto</span><b class="red">'+sol(Math.max(0,f))+'</b></div></div></section><section class="panel"><div class="head"><div><h2>▣ Cuadro de Control de Gastos</h2><p>Fechas y montos editables. Se guardan en este navegador.</p></div><div class="legend">Borde rojo = saldo editable</div></div><div class="tablewrap"><table><thead><tr><th>INDICADOR / CUENTA</th>'+state.cuentas.map(x=>'<th><span class="pill '+x.c+'">'+x.n+'</span></th>').join('')+'<th>TOTALES</th></tr></thead><tbody>';rows.forEach(r=>h+='<tr><td>'+r[0]+'</td>'+r[1].map(x=>'<td class="pos">'+x+'</td>').join('')+'<td class="muted">–</td></tr>');['ini','act','fin'].forEach((k,j)=>h+='<tr><td>'+['▣ FECHA DE INICIO','▣ FECHA ACTUAL','▣ FECHA DE TERMINO'][j]+'</td>'+state.cuentas.map((x,i)=>'<td><input class="datein" type="date" value="'+x[k]+'" onchange="dateC('+i+',\''+k+'\',this.value)"></td>').join('')+'<td class="muted">–</td></tr>');h+='<tr><td class="rowred">▣ INGRESO GASTO</td>'+state.cuentas.map((x,i)=>'<td>'+money(x.p,'inputC('+i+',\'p\',this.value)')+'</td>').join('')+'<td><b>'+sol(p)+'</b></td></tr><tr><td>▦ GASTO POR DÍA</td>'+state.cuentas.map((x,i)=>'<td>'+money(x.g??'','inputC('+i+',\'g\',this.value)','')+'</td>').join('')+'<td><b>'+sol(total(cs.map(x=>x.g||0)))+'</b></td></tr><tr class="result"><td>◔ RESULTADO SALDO</td>'+cs.map(x=>'<td><b>'+(x.res==null?'—':sol(x.res))+'</b></td>').join('')+'<td><b>'+sol(total(cs.map(x=>x.res||0)))+'</b></td></tr><tr class="balance"><td class="rowred">▰ SALDO TARJETA</td>'+state.cuentas.map((x,i)=>'<td>'+money(x.s,'inputC('+i+',\'s\',this.value)',true)+'</td>').join('')+'<td><b>'+sol(s)+'</b></td></tr><tr><td>● FALTANTE</td>'+cs.map(x=>'<td class="'+(x.f==null?'muted':x.f<=0?'pos':'neg')+'">'+(x.f==null?'—':sol(x.f))+'</td>').join('')+'<td class="'+(f<=0?'pos':'neg')+'">'+sol(f)+'</td></tr></tbody></table></div></section>';return h}function setCfg(k,v){state[k]=+v||0;save();render()}function add(t){let n=document.getElementById('nom').value,m=+document.getElementById('mon').value;if(!n||!m)return;state.movs.unshift({id:Date.now(),n,m,t});save();render()}function del(id){state.movs=state.movs.filter(x=>x.id!==id);save();render()}function interbank(){let g=total(state.movs.filter(x=>x.t==='gasto').map(x=>x.m)),a=+state.abono+total(state.movs.filter(x=>x.t==='abono').map(x=>x.m)),debt=g-a,disp=+state.linea-debt;return header('Tarjetas de Crédito - Interbank','Vista exclusiva: Banco Interbank (Visa Signature)')+'<section class="panel advisor"><div class="eye">● RESUMEN INTELIGENTE - BANCO INTERBANK</div><h2>● Advertencia: Deuda Pendiente de Pago</h2><p>Faltante total por consumo: <b class="red">'+sol(debt)+'</b></p><div class="stats"><div class="stat"><span>Línea de Crédito</span><b class="green">'+sol(state.linea)+'</b></div><div class="stat"><span>Consumido</span><b class="red">'+sol(debt)+'</b></div><div class="stat"><span>Disponible</span><b class="green">'+sol(disp)+'</b></div><div class="stat"><span>Faltante a pagar</span><b class="red">'+sol(debt)+'</b></div></div></section><section class="grid"><article class="panel card"><h2>▣ Mi Tarjeta Interbank</h2><div class="field"><label>LÍNEA DE CRÉDITO<small>Editable</small></label>'+money(state.linea,'setCfg(\'linea\',this.value)')+'</div><div class="field"><label>ABONO INICIAL / MANUAL<small>Editable</small></label>'+money(state.abono,'setCfg(\'abono\',this.value)')+'</div><div class="field">ABONOS TOTALES <b class="green">'+sol(a)+'</b></div><div class="field debt">FALTANTE POR CONSUMO <b>'+sol(debt)+'</b></div><div class="visa"><b>VISA SIGNATURE</b><p>•••• 2026</p><div class="twocol"><div>CONSUMIDO<strong>'+sol(debt)+'</strong></div><div class="right">DISPONIBLE<strong>'+sol(disp)+'</strong></div></div></div></article><article class="panel card"><h2>▤ REGISTRAR MOVIMIENTO</h2><div class="moveform"><input id="nom" placeholder="Ej: Tottus, compras..."><input id="mon" type="number" placeholder="Monto S/"><button class="expense" onclick="add(\'gasto\')">− Gasto</button><button onclick="add(\'abono\')">+ Abono</button></div><h3>HISTORIAL DE CONSUMOS Y ABONOS</h3>'+state.movs.map(x=>'<div class="movement"><span>'+x.n+'</span><b class="'+(x.t==='gasto'?'neg':'pos')+'">'+(x.t==='gasto'?'−':'+')+sol(x.m)+'</b><button onclick="del('+x.id+')">⌫</button></div>').join('')+'</article></section>'}function hist(){let c=state.cuentas.map(calc),op=total(c.map(x=>x.used*(x.g||0))),ta=total(state.movs.filter(x=>x.t==='gasto').map(x=>x.m)),ab=+state.abono+total(state.movs.filter(x=>x.t==='abono').map(x=>x.m)),key=state.cuentas[0].act.slice(0,7);state.hist=state.hist.filter(x=>x.k!==key);state.hist.push({k:key,op,ta,ab});save();let year=key.slice(0,4),data=M.map((m,i)=>state.hist.find(x=>x.k===year+'-'+String(i+1).padStart(2,'0'))||{op:0,ta:0,ab:0});return{op,ta,ab,data,year}}function bar(data,k,color){let max=Math.max(1,...data.map(x=>x[k]));return '<div class="bars">'+data.map((x,i)=>'<div class="barcol"><div class="track"><i style="height:'+(x[k]?Math.max(5,x[k]/max*100):0)+'%;background:'+color+'"></i></div><span>'+M[i]+'</span></div>').join('')+'</div>'}function line(data){let max=Math.max(1,...data.map(x=>Math.max(x.ta,x.ab))),pts=k=>data.map((x,i)=>(5+i*8.15)+','+(89-x[k]/max*72)).join(' ');return '<div class="linebox"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M5 89H95M5 53H95M5 17H95" class="gridline"/><polyline points="'+pts('ta')+'" class="l1"/><polyline points="'+pts('ab')+'" class="l2"/></svg><div class="labels">'+M.map(x=>'<span>'+x+'</span>').join('')+'</div></div><div class="legendline"><i></i>Consumos <i class="a"></i>Abonos</div>'}function dashboard(){let h=hist(),rub=state.cuentas.map((x,i)=>({n:x.n,v:calc(x).used*(calc(x).g||0),c:['#19d8a9','#ffc12b','#ff7a24'][i]}),max=Math.max(1,...rub.map(x=>x.v));return header('Dashboard mensual','Historial de gastos operativos y tarjetas')+'<section class="panel advisor"><div class="eye">● RESUMEN DEL MES</div><h2>Visión general de tus gastos</h2><p>Los gráficos se actualizan con los datos registrados.</p><div class="stats"><div class="stat"><span>Gasto operativo</span><b class="blue">'+sol(h.op)+'</b></div><div class="stat"><span>Consumo tarjeta</span><b class="red">'+sol(h.ta)+'</b></div><div class="stat"><span>Abonos</span><b class="green">'+sol(h.ab)+'</b></div><div class="stat"><span>Total gasto</span><b class="green">'+sol(h.op+h.ta)+'</b></div></div></section><div class="sectiontitle"><div><h2>Historial anual '+h.year+'</h2><p>Comparación por mes de gastos y tarjeta.</p></div><span>ENERO — DICIEMBRE</span></div><section class="charts"><article class="panel chart"><div class="charthead"><div><h2>Gasto operativo por mes</h2><p>Movilidad y comidas.</p></div><span class="tag">BARRAS</span></div>'+bar(h.data,'op','#19d8a9')+'</article><article class="panel chart"><div class="charthead"><div><h2>Tarjeta por mes</h2><p>Consumos y abonos.</p></div><span class="tag">LÍNEAS</span></div>'+line(h.data)+'</article></section><section class="charts"><article class="panel chart"><div class="charthead"><div><h2>Gastos por rubro</h2><p>Período actual.</p></div><span class="tag">BARRAS</span></div><div class="bars">'+rub.map(x=>'<div class="barcol"><b>'+sol(x.v)+'</b><div class="track"><i style="height:'+(x.v?Math.max(5,x.v/max*100):0)+'%;background:'+x.c+'"></i></div><span>'+x.n+'</span></div>').join('')+'</div></article><article class="panel chart"><div class="charthead"><div><h2>Evolución acumulada</h2><p>Operativo + tarjeta.</p></div><span class="tag">LÍNEA</span></div>'+line(Array.from({length:12},(_,i)=>({ta:h.ta*i/11,ab:h.op*i/11})))+'</article></section>'}function render(){document.getElementById('app').innerHTML=state.view==='interbank'?interbank():state.view==='dashboard'?dashboard():gastos()}render();
</script></body></html>
